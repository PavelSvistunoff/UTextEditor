[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utexteditor"
version = "0.1.0"
description = "A local-first desktop text editor with Ollama assistance"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.6", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
utexteditor = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_ollama: opt-in end-to-end test using the configured Ollama server and model"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/*.svg", "resources/translations/*.qm"]
